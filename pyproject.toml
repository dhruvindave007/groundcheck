[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groundcheck"
version = "0.1.0"
description = "A benchmark for whether LLM agents cite real evidence or fabricate it"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Dhruvin Dave" }]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic"]
bedrock = ["boto3"]
dev = ["pytest", "pyyaml"]

[project.scripts]
groundcheck = "groundcheck.cli:main"

[tool.setuptools.packages.find]
include = ["groundcheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
